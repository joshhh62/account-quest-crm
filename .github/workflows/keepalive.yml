name: keep the CRM fresh
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the CRM so it reads new data from the MCP
        run: |
          for i in 1 2 3; do
            curl -fsS -m 25 -o /dev/null -w "%{http_code}\n" https://account-quest-crm-eight.vercel.app/api/state && break
            sleep 10
          done

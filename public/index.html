<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account CRM: Eastern Counties and Aldermoor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="progress"></div>
<header class="top">
  <div class="brandrow"><span class="logo"></span><span class="brand">Account CRM</span><span class="hint">Every number cites its id. Click an <span class="chip demo">id</span> to read the source.</span></div>
  <div id="status" class="status" aria-live="polite"></div>
</header>
<div id="newbar"></div>
<nav id="tabs" class="tabs" role="tablist"></nav>
<main id="app"><p class="loading">Loading the accounts…</p></main>
<aside id="drawer" class="drawer" hidden>

  <div id="drawer-body"></div>
</aside>
<script src="/fx.js"></script>
<script src="/app.js" type="module"></script>
